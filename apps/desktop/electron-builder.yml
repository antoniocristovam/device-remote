# Packaging for Windows (NSIS installer) and macOS (DMG + ZIP, Apple Silicon and Intel).
# Build: npm run dist:win (Windows) / npm run dist:mac (macOS only; Apple tooling required).
# Signing/notarisation are driven by environment variables (see docs/build.md); without them the
# builds are unsigned, which is fine for development.
appId: com.remotecontroller.desktop
# Electron is hoisted to the workspace root; pin the version electron-builder downloads.
electronVersion: 45.0.0
productName: Remote Controller
copyright: Copyright © 2026 Remote Controller
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - package.json
  # Bundled into out/ by electron-vite; workspace sources are not needed at runtime.
  - '!node_modules/@rc/**'
  - '!node_modules/zod/**'
asar: true
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

mac:
  category: public.app-category.utilities
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: build/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  minimumSystemVersion: '12.0'
  extendInfo:
    # macOS 15+ asks before an app talks to devices on the local network (the signaling server on
    # the LAN and the phone's WebRTC candidates).
    NSLocalNetworkUsageDescription: O Remote Controller conecta-se ao servidor de sinalização e ao celular pareado na sua rede local.
    NSBonjourServices: []
    LSApplicationCategoryType: public.app-category.utilities
dmg:
  title: ${productName} ${version}
  contents:
    - { x: 150, y: 190 }
    - { x: 390, y: 190, type: link, path: /Applications }

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Remote Controller
