# Local stack: signaling + coturn. Usage (from repo root):
#   TURN_SECRET=$(openssl rand -hex 32) PUBLIC_IP=192.168.x.x docker compose -f infra/docker-compose.yml up --build
services:
  signaling:
    build:
      context: ..
      dockerfile: apps/signaling/Dockerfile
    ports: ["8787:8787"]
    environment:
      PORT: "8787"
      TURN_SECRET: ${TURN_SECRET:?set TURN_SECRET}
      TURN_URLS: turn:${PUBLIC_IP:?set PUBLIC_IP}:3478?transport=udp,turn:${PUBLIC_IP}:3478?transport=tcp
      STUN_URLS: stun:${PUBLIC_IP}:3478
      TURN_TTL: "600"
    restart: unless-stopped

  coturn:
    image: coturn/coturn:4.6
    network_mode: host # TURN needs the relay port range; host networking avoids mapping thousands of ports
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=remote-controller
      - --external-ip=${PUBLIC_IP}
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-multicast-peers
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
    restart: unless-stopped
